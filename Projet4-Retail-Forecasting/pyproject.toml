[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast"
version = "0.1.0"
description = "Projet 4 — Retail ML Forecasting : SageMaker + Kafka/MSK + agent LLM (MIT 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "sagemaker>=2.214", "s3fs>=2024.2.0", "kafka-python>=2.0.2"]
llm = ["langchain>=0.2", "langchain-community>=0.2", "langgraph>=0.1", "faiss-cpu>=1.8"]
ui = ["streamlit>=1.33", "plotly>=5.20"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
